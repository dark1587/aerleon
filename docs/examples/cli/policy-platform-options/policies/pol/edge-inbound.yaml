filters:
  - header:
      targets:
        cisco: edge-inbound extended
        juniper: edge-inbound inet noverbose
# --8<-- [start:sample-terms]
    terms:
      - name: allow-ssh
        comment: "Allow SSH from the management network."
        source-address: MGMT
        protocol: tcp
        destination-port: SSH
        action: accept
      - name: default-deny
        action: deny
# --8<-- [end:sample-terms]
